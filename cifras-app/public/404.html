<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cifras</title>
  <script>
    // SPA redirect para GitHub Pages (projeto em subdiretório /cifras/)
    // Mantém 1 segmento do path (/cifras) e codifica o resto como query param
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
