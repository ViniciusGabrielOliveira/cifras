<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="36" height="36">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
            </svg>
            <span>Cifras da Missa</span>
        </div>

        <h1 class="login-titulo">Painel Administrativo</h1>
        <p class="login-sub">Faça login para gerenciar listas e músicas</p>

        <!-- ── Login Social ──────────────────────────────────────── -->
        <button type="button" class="btn-google" (click)="loginGoogle()" [disabled]="carregando()">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continuar com Google
        </button>

        <div class="login-divider">
            <span>ou</span>
        </div>

        <!-- ── Login Email/Senha ─────────────────────────────────── -->
        <form class="login-form" (ngSubmit)="entrar()">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" class="form-input" placeholder="seu@email.com" [ngModel]="email()"
                    (ngModelChange)="email.set($event)" name="email" required />
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" type="password" class="form-input" placeholder="••••••••" [ngModel]="senha()"
                    (ngModelChange)="senha.set($event)" name="senha" required />
            </div>

            @if (erro()) {
            <div class="login-erro">⚠ {{ erro() }}</div>
            }

            <button type="submit" class="btn-login" [disabled]="carregando()">
                @if (carregando()) {
                <div class="spinner" style="width:18px;height:18px;border-width:2px"></div>
                Entrando...
                } @else {
                Entrar
                }
            </button>

            <div style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #666;">
                Ainda não tem conta? <a routerLink="/admin/cadastro" style="color: #4285f4; text-decoration: none; font-weight: 500;">Criar conta</a>
            </div>
        </form>
    </div>
</div>
