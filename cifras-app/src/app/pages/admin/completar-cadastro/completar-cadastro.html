<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="36" height="36">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
            </svg>
            <span>Cifras da Missa</span>
        </div>

        <h1 class="login-titulo">Finalizar Cadastro</h1>
        <p class="login-sub">Falta pouco! Complete suas informações para continuar.</p>

        <form class="login-form" (ngSubmit)="salvar()">
            <div class="form-group">
                <label for="telefone">Celular <span class="opcional">(obrigatório)</span></label>
                <input id="telefone" type="tel" class="form-input" placeholder="(11) 99999-9999"
                    [ngModel]="telefone()" (input)="formatarTelefone($event)" name="telefone" required />
            </div>

            @if (erro()) {
            <div class="login-erro">⚠ {{ erro() }}</div>
            }

            <button type="submit" class="btn-login" [disabled]="carregando() || telefone().length < 14">
                @if (carregando()) {
                <div class="spinner" style="width:18px;height:18px;border-width:2px"></div>
                Salvando...
                } @else {
                Concluir
                }
            </button>
        </form>
    </div>
</div>
