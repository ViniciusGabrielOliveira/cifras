<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div class="modal-overlay" (click)="fechar.emit()"></div>
<div class="modal-busca" role="dialog" aria-modal="true">
  <div class="modal-header">
    <div class="modal-titulo-group">
      <span class="modal-titulo">Adicionar música</span>
      <span class="modal-parte-badge">{{ partesLabels()[parte()] ?? parte() }}</span>
    </div>
    <button class="modal-close" (click)="fechar.emit()">✕</button>
  </div>

  <div class="modal-body">
    @if (erro()) {
      <div class="modal-erro-cc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ erro() }}
        <button class="btn-erro-fechar" (click)="limparErro.emit()">✕</button>
      </div>
    }
    <app-musica-search
      placeholder="Ex: Aleluia, Vem Senhor, Irmã Míria..."
      [modoEmbutido]="true"
      [mostrarCifraClub]="true"
      (musicaSelecionada)="musicaSelecionada.emit($event)"
      (cadastrarNova)="cadastrarNova.emit($event)"
    />
  </div>
</div>
