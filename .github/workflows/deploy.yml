name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

# ── Job 1: Build do Angular ──────────────────────────────────────────
jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cifras-app/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: cifras-app

      - name: Generate environment.prod.ts
        run: |
          cat > src/environments/environment.prod.ts << 'EOF'
          export const environment = {
            production: true,
            cifrasApiUrl: '${{ secrets.CIFRAS_API_URL }}',
            cifrasApiKey: '${{ secrets.CIFRAS_API_KEY }}',
          };
          EOF
        working-directory: cifras-app

      - name: Build
        run: npx ng build --configuration=production --base-href="/${{ github.event.repository.name }}/"
        working-directory: cifras-app

      - name: Copy index.html → 404.html (SPA routing fix)
        run: cp dist/cifras-app/browser/index.html dist/cifras-app/browser/404.html
        working-directory: cifras-app

      - name: Add .nojekyll
        run: touch dist/cifras-app/browser/.nojekyll
        working-directory: cifras-app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cifras-app/dist/cifras-app/browser

# ── Job 2: Deploy GitHub Pages ───────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ── Job 3: Deploy Cloud Functions ────────────────────────────────────
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Roda no push manual, ou quando há alterações em functions/
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJSON(github.event.commits.*.modified), 'functions/') ||
      contains(toJSON(github.event.commits.*.added), 'functions/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
